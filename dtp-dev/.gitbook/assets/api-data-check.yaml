        - address
      summary: Address autocomplete
      description: |
        This service can be used to obtain suggestion for complete addresses by providing an incomplete address. 
        The user can decide between sending a full address (fullAddress) or splitting the request parameters.
        When using the fullAddress approach, the following structure must be followed: street houseNumber swissZipCode town.
        When using the separate parameters, the fullAddress should not be sent, otherwise these parameters will be overwritten.
        The response is a list containing all possible addresses.
      operationId: addressAutocompleteService
      security:
        - jwt: []
      parameters:
        - $ref: "#/components/parameters/tenantId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressAutocompleteRequest"
      responses:
        '200':
          description: successful request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressAutocompleteResponse"
        '422':
          description: Unprocessable Entity (see 1.4 to get the full list of status codes can be received)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

