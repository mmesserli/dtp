components:
  parameters:
    tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    jwt:
      type: http
      description: Default Authentication/Authorization
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PersonInfoRequest:
      allOf:
      - $ref: '#/components/schemas/UnencryptedPersonInfoRequest'
      - $ref: '#/components/schemas/EncryptedRequest'

    PersonInfoResponse:
      description: This object must include exactly one of the following schemas.
      oneOf:
      - $ref: '#/components/schemas/UnencryptedPersonInfoResponse'
      - $ref: '#/components/schemas/EncryptedResponse'

    UnencryptedPersonInfoRequest:
      type: object
      required:
        - dataProfileId
        - reportType
      properties:
        dataProfileId:
          nullable: false
          type: integer
          example: 1
          description: Data profile ID
        firstName:
          type: string
          example: ea non
          description: First name
        lastName:
          type: string
          example: ea non
          description: Last name
        birthdate:
          type: string
          format: date
          example: 1977-11-29
          description: Birth date (e.g. 1980-01-01)
        street:
          type: string
          example: ea non
          description: Street
        houseNumber:
          type: string
          example: ea non
          description: House number
        town:
          type: string
          example: ea non
          description: Town
        zipCode:
          type: string
          example: ea non
          description: Postal Code
        countryCode:
          type: string
          example: ea non
          description: Country Code
        phone:
          type: string
          example: ea non
          description: Phone number
        email:
          type: string
          example: ea non
          description: E-mail address
        ipAddress:
          type: string
          example: ea non
          description: IP address
        idNumber:
          type: string
          example: ea non
          description: ID number
        productCategory:
          type: string
          example: ea non
          description: Product Category (see 4.3.20)
        reportType:
          type: string
          example: ea non
          description: (Required) Type of report (see 4.3.1)
          nullable: false
        matchingProfile:
          type: integer
          example: 1
          description: Matching profile to use (see 4.3.2)
        sortType:
          type: string
          example: ea non
          description: Sorting Type (see 4.3.3)
        requestId:
          type: string
          example: ea non
          description: The value of this field will be ignored if it is available in the request.
        costCenter:
          description: Cost center can be defined by customer.
          type: string
          nullable: true
        iid:
          type: string
          example: ea non
        personId:
          type: integer
          format: int32
          example: 123

    UnencryptedPersonInfoResponse:
      type: object
      properties:
        addressData:
          type: object
          description: Address data related information
          properties:
            formerAddresses:
              type: array
              description: Former address related information
              items:
                type: object
                properties:
                  aadsCode:
                    type: integer
                    example: 32
                    description: Address status code (see 4.3.16)
                  aadsDate:
                    type: string
                    example: 2019-02-19
                    description: Address status date
                  addressId:
                    type: string
                    example: 1-418707201
                    description: Unique address identification number
                  countryCode:
                    type: string
                    example: CH
                  houseNumber:
                    type: string
                    example: '4'
                  street:
                    type: string
                    example: Stoss
                  swissZipCode:
                    type: string
                    example: '9104'
                    description: Postal code for swiss addresses
                  town:
                    type: string
                    example: Waldstatt
                  zipCode:
                    type: string
                    example: '9104'
                    description: Postal code
              example:
              - aadsCode: 32
                aadsDate: 2019-02-19
                addressId: 1-418707201
                countryCode: CH
                houseNumber: '4'
                street: Stoss
                swissZipCode: '9104'
                town: Waldstatt
                zipCode: '9104'
              - aadsCode: 32
                aadsDate: 2004-08-24
                addressId: 1-418707206
                countryCode: CH
                houseNumber: '1007'
                street: Zürchersmühle
                swissZipCode: '9107'
                town: Urnäsch
                zipCode: '9107'
            newestAddress:
              type: object
              description: Newest address related information
              properties:
                aadsCode:
                  type: integer
                  example: 10
                  description: Address status code (see 4.3.16)
                aadsDate:
                  type: string
                  example: 2021-01-15
                  description: Address status date
                addressId:
                  type: string
                  example: 100-10343980
                  description: Unique address identification number
                countryCode:
                  type: string
                  example: CH
                houseNumber:
                  type: string
                  example: '9'
                street:
                  type: string
                  example: Bachstrasse
                swissZipCode:
                  type: string
                  example: '9100'
                  description: Postal code for swiss addresses
                town:
                  type: string
                  example: Herisau
                zipCode:
                  type: string
                  example: '9100'
                  description: Postal code
        bankruptcyData:
          type: object
          description: Bankruptcy data related information (from SHAB)
          properties:
            details:
              type: array
              description: Detailed bankruptcy data related information
              items:
                type: object
                properties:
                  messageDetails:
                    type: string
                    description: Message content
                    example: |-
                      resolutionDate: 2018-09-05.
                      addition: refusedLegacy.
                      cessationDate: 2018-09-27.
                      advanceAmount: 3000.
                      daysAfterPublication: 10.
                      entryDeadline: 2018-10-29.
                      registrationOffice: Konkursamt Appenzell Ausserrhoden, Zweigstelle Heiden AR,
                      Claudius Meier, Konkursbeamter,
                      Sonnenweg 12, Postfach: 2,
                      9410 Heiden.
                      remarks: Ausgeschlagene Erbschaft gemäss Art. 193 SchKG.
                  publicationDate:
                    type: string
                    example: 2018-10-18
                  publicationNumber:
                    type: string
                    example: KK03-0000001304
                  rubric:
                    type: string
                    example: KK
                    description: Rubric value (see 4.3.8)
                  subRubric:
                    type: string
                    example: KK03
                    description: Subrubric value (see 4.3.9)
                  title:
                    type: string
                    description: Title of publication
                    example: Einstellung des Konkursverfahrens Caspar Bösch, ausgeschlagene Erbschaft
        blacklistData:
          type: object
          description: Blacklist data related information
          properties:
            lists:
              type: array
              description: Detailed blacklist data related information
              items:
                type: object
                properties:
                  birthdate:
                    type: string
                    format: date
                    example: 1960-12-08
                    description: Birth date of blacklist hit
                  email:
                    type: string
                    example: test@test.com
                    description: E-mail of blacklist hit
                  ext1:
                    type: string
                    example: test data
                    description: Ext1 attribute of blacklist hit
                  ext2:
                    type: string
                    example: test data
                    description: Ext2 attribute of blacklist hit
                  firstName:
                    type: string
                    example: Caspar
                    description: First name of blacklist hit
                  hcbtCode:
                    type: integer
                    example: 1
                    description: Code of blacklist hit
                  houseNumber:
                    type: string
                    example: '9'
                    description: House number of blacklist hit
                  info:
                    type: string
                    example: test data
                    description: Info attribute of blacklist hit
                  initials:
                    type: string
                    example: test data
                    description: Initial attribute of blacklist hit
                  ipAddress:
                    type: string
