                totalOpenAmount:
                  type: number
                  example: 60839.8
                  description: Open amount
            details:
              type: array
              description: Detailed collection data related information
              items:
                type: object
                properties:
                  amount:
                    type: number
                    example: 903.7
                    description: Amount
                  caseRef:
                    type: string
                    example: '1090035'
                    description: Case reference
                  closingCode:
                    type: integer
                    nullable: true
