openapi: 3.0.3
info:
  title: m_IDeal data check API
  description: |
    # m_IDeal data check API documentation

    ## Overview

    This documents API for Tenant who integrate with m_IDeal. A Tenant can call API for credit information to m_IDeal and then get the information.

    ## Authentication

    m_IDeal will grant you an API token (JWT) with a lifetime (by default) of 1 year. This JWT token **MUST** be included in the header `Authorization: Bearer {{ TOKEN }}`.

    ## Reference

    You can check the detail explanation in the documentation from Intrum (Documentation: CI-WS (Credit Information Web Services) v0.0.40) to understand the meaning of some parameters. For example, if you see `(see 4.3.2)`, you can go to section 4.3.2
     matchingProfile to get it.

  version: 3.28.0
  contact:
    email: m_ideal@mesoneer.io
servers:
- url: https://sandbox-autoid.id-validation.ch/api/v1
tags:
- name: public
  description: Public information supports getting credit information through facade API
- name: address
  description: Credit information with address
- name: company
  description: Credit information with company
- name: person
  description: Credit information with person
- name: compliance
  description: Credit information with compliance
- name: kremo
  description: Credit information with budget calculation
- name: zek
  description: Credit information of individuals registered in ZEK

paths:

  /public/credit-information/public-key:
    get:
      tags:
      - public
      summary: Get public key information
      description: |
        The API will provide information of PKCS#1 RSA Public Key (RFC3447) encoding in PEM format, expiration timestamps, and fingerprint of the key.
        A new public key will be generated and returned before the current one expires in two weeks.
      operationId: getPublicKey
      responses:
        '200':
          description: Public key response successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataCheckPublicKeyResponse"
        '404':
          description: No activated keys found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

