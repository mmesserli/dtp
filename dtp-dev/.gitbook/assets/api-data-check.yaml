                    type: string
                    example: BLACKLIST_EXAMPLE
                    description: Source name of blacklist hit
                  street:
                    type: string
                    example: Bachstrasse
                    description: Street of blacklist hit
                  swissZipCode:
                    type: string
                    example: '9100'
                    description: Postal code for swiss addresses
                  town:
                    type: string
                    example: Herisau
                    description: Town of blacklist hit
        collectionData:
