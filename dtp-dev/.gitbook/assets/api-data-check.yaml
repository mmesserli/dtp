        - $ref: '#/components/schemas/EncryptedRequest'

    ZekCreditApplicationRejectionResponse:
      description: This object must include exactly one of the following schemas.
      oneOf:
        - $ref: '#/components/schemas/UnencryptedZekCreditApplicationRejectionResponse'
        - $ref: '#/components/schemas/EncryptedResponse'

    UnencryptedZekCreditApplicationRejectionRequest:
      type: object
      required:
        - dataProfileId
        - elementId
        - rejectionReason
      properties:
        dataProfileId:
          nullable: false
          type: integer
          example: 1
          description: Data profile ID
        requestId:
          type: string
          example: ea non
          description: The value of this field will be ignored if it is available in the request.
        clientId:
          description: Client ID
          example: '250241010160'
          type: string
        elementId:
          type: integer
          format: int64
          description: Element Id
          example: 230511010948
          nullable: false
        rejectionReason:
          description: Rejection reason of credit request
          type: string
          example: PARTIAL_OR_TOTAL_LOSS
          enum:
            - NOT_REJECTED
            - SPECIAL_MEASURES
            - PARTIAL_OR_TOTAL_LOSS
            - LEGAL_AMBIGUITIES
            - DEBT_RATIO
            - PATERNALISM
            - ACCURACY_OF_INFORMATION_IS_QUESTIONABLE
            - OTHER_PARTICULAR_NON-PERSON_REASONS
            - BLOCKED_BY_OFFICE
            - CREDIT_REQUEST_TOO_HIGH
            - REFUSAL_ON_LEGAL_GROUNDS
            - OTHER_REASON_FOR_CREDITWORTHINESS-ABILITY
          nullable: false
        costCenter:
          description: Cost center can be defined by customer.
          type: string
          nullable: true

