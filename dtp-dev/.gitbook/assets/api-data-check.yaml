    ZekPersonCardMessageRegistrationResponse:
      description: This object must include exactly one of the following schemas.
      oneOf:
        - $ref: '#/components/schemas/UnencryptedZekPersonCardMessageRegistrationResponse'
        - $ref: '#/components/schemas/EncryptedResponse'

    UnencryptedZekPersonCardMessageRegistrationRequest:
      allOf:
        - $ref: '#/components/schemas/ZEKPersonIdentificationClientIdOrFull'
        - type: object
          description: This object must include exactly one of the following schemas.
          required:
            - dataProfileId
            - cardEventCode
            - cardMessageDate
          properties:
            dataProfileId:
              nullable: false
              type: integer
              example: 1
              description: Data profile ID
            costCenter:
              description: Cost center can be defined by customer.
              type: string
              nullable: true
            requestId:
              description: Request ID
              type: string
              nullable: true
            annulmentDate:
              description: Annulment date (e.g. 1980-01-01)
              type: string
              format: date
              nullable: true
            cardEventCode:
              description: Card event code
              type: string
              example: DEBT_RESTRUCTURING
              enum:
                - BLOCKED_BANK_CARD
                - BLOCKED_CARD
                - ONGOING_DEBT_COLLECTION_MEASURES
                - PARTIAL_OR_TOTAL_LOSS
                - DEBT_RESTRUCTURING
                - WHEREABOUTS_UNKNOWN
                - CARHOLDER_ABUSE
                - OTHER_REASONS
                - INFORMATION_IN_DOUBT
                - OTHER_REASONS_REJECTED
                - CONTRACTOR_PROBLEM
              nullable: false
            cardMessageDate:
              description: Card message date (e.g. 1980-01-01)
              type: string
              format: date
              nullable: false
            cardTypeCode:
              description: Card type Code
              type: string
              example: CREDIT_CARD_WITH_CREDIT_OPTION
              enum:
                - UNKNOWN
                - TE-CARD_CARD_PRIVILEGED
                - TE-CARD_STANDARD
                - TE-CARD_BANK
                - CREDIT_CARD_WITH_CREDIT_OPTION
                - CREDIT_CARD_BANK_ISSUER
                - SHOPPING_CARD
                - OTHER_CARDS
              nullable: true
            negativeEventDate:
              description: Negative event date (e.g. 1980-01-01)
              type: string
              format: date
              nullable: true

