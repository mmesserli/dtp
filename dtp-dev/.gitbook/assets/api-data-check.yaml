        - $ref: '#/components/schemas/ZEKCreditApplicationDeletionResponseMultiPersons'

    EncryptedRequest:
      type: object
      properties:
        encryptedSecretKey:
          type: string
          description: Encrypted secret key. It is the output of Encryption operation when given key and plain text (secret with raw value). It is also the data fed to a Decryption function.

    EncryptedResponse:
      type: object
      properties:
        encryptedData:
          $ref: '#/components/schemas/EncryptedData'

    EncryptedData:
      properties:
        associatedData:
          type: string
          format: binary
          example: QUVTL0dDTS9Qcm90b2NvbFZlcnNpb24x
          description: meta data to verify with the secret key
        cipherText:
          type: string
          format: binary
          example: mMCRWg7casdf
          description: Encrypted data response. It is the output of Encryption operation when given key and plain text of the response. It is also the data fed to a Decryption function.

    DataCheckPublicKeyResponse:
      properties:
        publicKey:
          type: string
          nullable: false
          example: 
          description: Represent an PKCS#1 RSA Public Key (RFC3447) encoding in PEM format without header `-----BEGIN PUBLIC KEY-----` and footer `-----END PUBLIC KEY-----`.
        expirationTimestamp:
          type: string
          format: date-time
          nullable: false
          example: 2024-10-19T10:33:14.358Z
          description: The key's expiration timestamp in UTC. Once it expires, the key cannot be used for any purpose.
        fingerprint:
          type: string
          nullable: false
          example: lzHouMXrG+XzDGqNEwLig5suYM4TiAfp0AB3HP4o2Xw=
          description: Fingerprint of the key. The value of the fingerprint is encoded in base64 using `SHA-256` of RSA Public Key.

