        signerId:
          type: string
          format: uuid
        ubiSignUrl:
          type: string
        nonce:
          type: string

    Language:
      type: string
      enum:
        - DE
        - FR
        - IT
        - EN
      description: |
        * `DE` - German
        * `FR` - France
        * `IT` - Italian
        * `EN` - English

    TermsConditionCmsContent:
      type: object
      properties:
        language:
          type: string
          example: de
        introductionText:
          type: string
          description: the title of term condition
        contents:
          type: array
          items:
            type: object
            properties:
              toggleName:
                type: string
              toggleText:
                type: string
                description: the toggle text which can contain placeholders which will be replace by place holders items. Note that the index is important here, the {1} will be replaced by the first placeholder and so on
                example: I give the {1} and {2} consent to the processing of personal data.
              placeholders:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      description:  the type of placeholders. See the value for details
                      enum:
                      - tenant-resource
                      - url
                      - disposable-contract
                    text:
                      type: string
                      description: the text will be displayed
                    value:
                      type: string
                      description: this specify how find the resource, the value format depend on the type. For tenant-resource, it's relative path of resource in tenant resource folder; for url, it's full url to get resource; for disposable contract, it's always ignored

    RevokeDocumentBasketRequest:
      type: object
      properties:
         expirationTimestamp:
          description: The expiration date time of document basket, if this field is not provided in the request the default expiration time will be assigned to now(UTC). The format of the expiration must be ISO-8601 format(`yyyy-MM-dd'T'HH:mm:ss`) and always in UTC time.
          type: string
          format: date-time
          example: "2023-10-22T15:23:23"

    FraudRisk:
      type: object
      description: Fraud risk.
      nullable: true
      properties:
        risk_rating:
          description: Risk rating.
          type: string
          nullable: true
        riskCode:
          description: Risk code.
          type: array
          items:
            type: string
          nullable: true
        fraudCheckId:
          type: string
          format: uuid
          description: Unique identifier for the fraud check.
          nullable: true
        request_id:
          type: string
          format: uuid
          description: Unique identifier for the request.
          nullable: true
        risk_score:
          type: string
          description: Risk score associated with the fraud assessment.
          nullable: true
        risk_rules:
          type: array
          description: List of rules contributing to the fraud risk assessment.
          items:
            $ref: '#/components/schemas/RiskRule'
        device:
          $ref: '#/components/schemas/Device'
        network:
          $ref: '#/components/schemas/Network'
        digitalId:
          $ref: '#/components/schemas/DigitalId'
        account:
          $ref: '#/components/schemas/Account'
        sessionHistory:
          $ref: '#/components/schemas/SessionHistory'
        identDeviceHistory:
          type: array
          description: History of ThreatMetrix sessions for the case, ordered chronologically (oldest first).
          items:
            $ref: '#/components/schemas/IdentDeviceHistory'
          nullable: true

    SessionHistory:
      type: object
      description: Aggregate counts of distinct values across the case's ThreatMetrix sessions.
      nullable: true
      properties:
        numberOfDeviceIds:
          type: integer
          description: Number of distinct device IDs across all sessions.
        numberOfTrueIpGeo:
          type: integer
          description: Number of distinct true IP geo locations across all sessions.
        numberOfTrueIpRegionIsoCodes:
          type: integer
          description: Number of distinct true IP region ISO codes across all sessions.

    IdentDeviceHistory:
      type: object
      description: Fraud-relevant data for a single ThreatMetrix session.
      properties:
        timestamp:
          type: string
          format: date-time
          description: Time the session was last updated.
          nullable: true
        step:
          type: string
          description: Identification step the session belongs to.
          nullable: true
        deviceId:
          type: string
          description: Unique identifier for the device.
          nullable: true
        risk_rating:
          type: string
          description: Risk rating of the session.
          nullable: true
        risk_score:
          type: string
          description: Risk score associated with the session.
          nullable: true
        risk_rule_categories:
          type: array
          description: Categories of triggered risk rules.
          items:
            type: string
          nullable: true
        true_ip_address:
          type: string
          description: True IP address of the request.
          nullable: true
        true_ip_geo:
          type: string
          description: Geographical location code of the IP address (e.g., CH for Switzerland).
          nullable: true
        true_ip_region_iso_code:
          type: string
          description: ISO code for the region of the IP address.
          nullable: true
        true_ip_city:
          type: string
          description: City associated with the IP address.
          nullable: true
        browser_spoof_rating:
          type: string
          description: Rating indicating likelihood of browser spoofing (e.g., low, high).
          nullable: true
        vpn_rating:
          type: string
          description: Rating indicating likelihood of VPN usage (e.g., low, high).
          nullable: true

    RiskRule:
      type: object
      description: Represents a single rule contributing to the fraud risk assessment.
