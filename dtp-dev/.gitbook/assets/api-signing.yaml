    NotifyLastDocumentReadyRequest:
      type: object
      properties:
         signerIds:
          items:
            type: string
            format: uuid
          nullable: true
          description: The specific signers can be notified for document signing by providing their `signerIds`. If no specific `signerIds` are provided, the last document readiness flag will be set to true for all signers by default.

    IdentificationRedirectUrls:
      type: object
      nullable: true
      properties:
        success:
          $ref: "#/components/schemas/Url"
        verificationRejected:
          $ref: "#/components/schemas/Url"
        failed:
          $ref: "#/components/schemas/Url"
        timeout:
          $ref: "#/components/schemas/Url"

    SigningRedirectUrls:
      type: object
      nullable: true
      properties:
        success:
          $ref: "#/components/schemas/Url"
        rejected:
          $ref: "#/components/schemas/Url"
        failed:
          $ref: "#/components/schemas/Url"
        timeout:
          $ref: "#/components/schemas/Url"
        redoIdentification:
          $ref: "#/components/schemas/Url"

    Url:
      type: string
      format: url
      maxLength: 1024
      description: |
        The customize URL in the request is required when redirect feature is enabled and default value is not available.
        The format of provided URL must follow the RFC-3986 standard.
        Below parameters must not be included in the URL if it is configured to be added by m_IDeal application.
        * `ubiIdCaseId`
        * `signerId`
        * `extCaseId`
        * `extPersonId`
        * `extApplication`
        * `ubiIdCategory`
      nullable: true
      example: "https://redirecturl.com?any_thing=abcXYZ"

    SignatureLevel:
      type: string
      description: |
        Level of assurance for the signature of the document when secondary signature is enabled.
        * `AES`
        * `QES`
        * `SES`
      enum:
        - AES
        - QES
        - SES

    LookupEvidenceResponse:
      type: object
      description: Found evidence information found by mobile phone number (msisdn)
      properties:
        isValid:
          type: boolean
          nullable: false
          description: |
            Validation result of evidence assurance level
            * `true`: Assurance level of the evidence is greater than or equal to assurance level defined in signing profile
            * `false`: The evidence is not found or assurance level of the evidence is less than assurance level defined in signing profile
          example: true
        profileAssuranceLevel:
          type: integer
          nullable: true
          description: Value of assurance level defined in signing profile
          example: 3
        evidenceAssuranceLevel:
          type: integer
          nullable: true
          description: Assurance level value of the evidence. This field will be `null` when evidence is not found.
          example: 4
        mobileId:
          type: boolean
          description: |
            * `true`: when serialNumber of the evidence contains prefix 'MID'.
            * `false`: other results.


    LookupEvidenceBadRequestResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: '400 BAD_REQUEST'
        errorMessage:
          type: string
          example: 'Required Integer parameter signProfileId is not present'

    ResourceNotFoundResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: '404 NOT_FOUND'
        errorMessage:
          type: string
          example: 'RESOURCE NOT FOUND'

    Alpha3CountryCode:
      nullable: true
      type: string
      description: |
        Country code (ISO 3166-1, Alpha-3 code).
        Note: For Kosovo, its Apha-3 code country abbreviation is 'XXK'
      example: CHE

    Base64EncodedFile:
      type: object
      description: |
        File response with content encoded in base64 and its fileExtension
      properties:
        fileContent:
          type: string
          format: byte
        fileExtension:
          type: string
          description: The file extension format will be pdf or zip
          example: "pdf"

    SignedDocumentWithHashResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        originalDocumentId:
          type: string
          format: uuid
        extDocumentId:
          type: string
        displayName:
          type: string
        hash:
          type: string
          description: SHA-256 hash of the signed document.
          example: 'abcdef1234567890...'
