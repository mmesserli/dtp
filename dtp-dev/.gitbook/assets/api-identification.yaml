    VerificationResultRequest:
      description: |
        Tenant will use this request data to update case status.
      type: object
      required:
        - identificationProcess
        - verificationData
      properties:
        identificationProcess:
          $ref: '#/components/schemas/IdentificationProcess'
        verificationData:
          $ref: '#/components/schemas/VerificationDataRequest'
        additionalDocuments:
          allOf:
          - $ref: "#/components/schemas/AdditionalDocument"

    IdentificationProcess:
      description: |
        Identification process.
      nullable: false
      type: object
      required:
        - result
      properties:
        result:
          nullable: false
          $ref: '#/components/schemas/VerificationResultStatus'
        reason:
          description: Detail reason. This field should be mandatory when the result is `CANCELLED` or `FRAUD_SUSPICION_CONFIRMED`
          example: IDENT_OTHER
          nullable: true
          type: string
        agentName:
          description: agentName
          nullable: true
          type: string
        wasNfcUsed:
          type: boolean
          nullable: true
          example: false
          description: |
           * `true` : If NFC could be scanned successfully.
           * `false`: If any non-NFC document is scanned, or the NFC scan fails, a visual scan of the document is performed as a fallback.

    VerificationResultStatus:
      description: Verification result value.
      type: string
      enum:
      - SUCCESS
      - CANCELED
      - FRAUD_SUSPICION_CONFIRMED

    VerificationDataRequest:
      type: object
      description: Verification data
      nullable: true
      properties:
        verificationDocument:
          $ref: '#/components/schemas/VerificationDocumentRequest'
        personData:
          $ref: '#/components/schemas/VerificationPersonData'
        address:
          $ref: '#/components/schemas/VerificationAddressData'

    VerificationDocumentRequest:
      type: object
      nullable: true
      description: verified data by tenant
      properties:
        title:
          type: string
          nullable: true
          description: Title
        classification:
          type: string
          enum:
          - IDCARD
          - PASSPORT
          - DRIVERS_LICENSE
          - RESIDENCE_PERMIT
          nullable: true
          description: classification of document
        firstName:
          type: string
          nullable: true
          description: First name.
          example: Peter Fritz
        lastName:
          type: string
          nullable: true
          description: Last name.
          example: Meier
        documentNumber:
          type: string
          nullable: true
          description: Document number
          example: X1234563
        birthdate:
          type: string
          nullable: true
          description: The birthdate with `yyyy-MM-dd` format.
          format: date
        issuingDate:
          type: string
          nullable: true
          description: The issuing date in 'yyyy-MM-dd' format.
          format: date
        expiryDate:
          type: string
          nullable: true
          description: The expiry date with `yyyy-MM-dd` format.
          format: date
        nationality:
          $ref: '#/components/schemas/Alpha3CountryCode'
        issuerCountry:
          $ref: '#/components/schemas/Alpha3CountryCode'
        gender:
          type: string
          nullable: true
          description: Gender as stated on document.
          example: M
        birthPlace:
          type: string
          nullable: true
          description: Birthplace as stated on document.
        issuedBy:
          type: string
          nullable: true
        entryDate:
          type: string
          nullable: true
          description: The entryDate in 'yyyy-MM-dd' format.
          format: date
        residencePermitType:
          type: string
          nullable: true
          description: Type of residence permit when scanning.

    VerificationPersonData:
      type: object
      properties:
        mobileCountryCode:
          type: string
          nullable: true
          description: |
            Country calling code (international subscriber dialing (ISD) code) of mobile phone number (might be used for TAN in case of signing), without leading "+" or leading 00.
            It's required for the case which enabled protected case.
          example: 41
        mobilePhoneNumber:
          type: string
          example: "23456789"
          nullable: true
          description: |
            Mobile phone number without country code and leading 0 (might be used for TAN in case of signing).
