    UbiIdStatus:
      type: string
      description: |
        * `INITIALIZED` - UMB_ID Case is created but not started on eId
        * `TIMEOUT` - session of a UMB_ID Case is time out
        * `IDENTIFICATION_SUCCESSFUL` - result of identification was successful
        * `IDENTIFICATION_FAILED` - identification failed
        * `VERIFICATION_PENDING`- the verification process is pending
        * `VERIFICATION_CONFIRMED` - Verification process successfully finished
        * `VERIFICATION_REJECTED` - Verification has been rejected
        * `DOWNLOADED` - zip file of a identification case with previous status VERIFICATION_CONFIRMED is downloaded
        * `DOWNLOAD_FAILED` - zip file of a identification case with previous status VERIFICATION_CONFIRMED is download failed
        * `DELETED` - person data and data deleted and deletion triggered on eId side 
        * `DELETED_MARKED` - deletion triggered in UMB_ID application. will be deleted x days after action was triggered.
        * `DELETED_TEMPORARY` - x days after a document was downloaded by the API the document basket is marked as temporary deleted.
        * `IDENTIFICATION_NOT_REQUIRED` - UMB_ID case is either identified by UMB_ID or has valid identification evidence by a qTSP provider.
        * `SCHEDULED` - Status of UMB_ID scheduled case.
        * `CORRUPTED` - UMB_ID case has corrupted files, it is no longer valid to be used.
      enum:
        - INITIALIZED
        - TIMEOUT
        - IDENTIFICATION_SUCCESSFUL
        - IDENTIFICATION_FAILED
        - VERIFICATION_PENDING
        - VERIFICATION_CONFIRMED
        - VERIFICATION_REJECTED
        - DOWNLOADED
        - DOWNLOAD_FAILED
        - DELETED
        - DELETED_MARKED
        - DELETED_TEMPORARY
        - IDENTIFICATION_NOT_REQUIRED
        - SCHEDULED
        - CORRUPTED

    RegistrationStatus:
     type: string
     enum: 
     - NO_REGISTRATION
     - REGISTRATION_OUTSTANDING
     - REGISTRATION_INITIALIZED
     - REGISTRATION_COMPLETED
     - REGISTRATION_FAILED
     - EVIDENCE_VALID
     description: |
      * `NO_REGISTRATION` - status in case no verification by a RA-Agent is required (always the case for UMB_ID)
      * `REGISTRATION_OUTSTANDING` - verification of identification required after identification was done by enduser
      * `REGISTRATION_INITIALIZED` - verification is initialized and assigned to a RA-Authority
      * `REGISTRATION_COMPLETED` - verification confirmed by a RA-Agent
      * `REGISTRATION_FAILED` - verification rejected by a RA-Agent
      * `EVIDENCE_VALID` - there is valid evidence provided by qTSP provider.
