openapi: 3.0.3

info:
  title: m_IDeal Schedule Cases API for Tenant

  description: |
    # m_IDeal Scheduled Cases

    ## Overview

    This documents API for Tenant to integrate with m_IDeal. A Tenant can _schedule_ a m_IDeal case and then allow their end user to start the identification themselves.

    ### A few conventions:
    
    - Resources are represented in plural form.
    - Words in each path segment are separated by hyphens "-"

    ## Authentication

    m_IDeal will grant you an API token (JWT) with a lifetime (by default) of 1 year. This JWT token **MUST** be included in the header `Authorization: Bearer {{ TOKEN }}`.

    ## Changes:

    - Renamed `ubiIdCategoryCode` field in request/response body into `ubiIdCategory` and is now optional.
    - `initialPersonData` field is now optional


  contact:
    email: m_ideal@mesoneer.io
  version: 3.35.0

servers:
  - url: https://sandbox-autoid.id-validation.ch/api/v1

tags:
  - name: scheduled-cases
    description: Operations related to scheduled cases

paths:

  "/{tenantId}/id-cases/schedule":
    post:
      operationId: createScheduledCase
      parameters:
        - $ref: "#/components/parameters/tenantId"
      
      tags:
        - scheduled-cases
      summary: Create a new scheduled case
      security:
        - jwt: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCaseRequest"

      responses:
        201:
          description: Created!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleCaseResponse"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/{tenantId}/scheduled-cases/{caseId}/start":
    parameters:
      - $ref: "#/components/parameters/tenantId"
      - $ref: "#/components/parameters/caseId"
    post:
      operationId: resumeScheduledCase
      tags:
        - scheduled-cases
      summary: Resume a scheduled case
      security:
        - jwt: []

      responses:
        200:
          description: Case status updated into INITIALIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UbiIdNewCaseResponse'
        404:
          description: Case not found or tenant not found
        403:
          description: Case cannot be resumed.
          
  "/{tenantId}/scheduled-cases/{caseId}":
    parameters:
      - $ref: "#/components/parameters/tenantId"
      - $ref: "#/components/parameters/caseId"
    put:
        tags:
          - scheduled-cases
        summary: Update scheduled case `eIdIdType` and `issuerCountry`
        security:
          - jwt: []
          
        requestBody:
          required: true
          content:
            "application/json":
              schema:
                $ref: '#/components/schemas/UbiIdUpdateCaseRequest'
          
        responses:
          204:
            description: Case information updated successfully
          400:
            description: Case information cannot be updated because of invalid params

  "/{tenantId}/scheduled-cases/{caseId}/complete":
    parameters:
      - $ref: "#/components/parameters/tenantId"
      - $ref: "#/components/parameters/caseId"
    post:
      tags:
        - scheduled-cases
      summary: Update scheduled case status using eID result for External Application
      security:
        - jwt: [ ]
      description: |
        This API is specially designed so that on End User UI, once the VideoID process settles (either success or fail)
      operationId: callbackIdentificationCase

      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: "#/components/schemas/IdentificationCaseCompleteRequest"

      responses:
        200:
          description: ok
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/IdentificationCaseCompleteResponse"
        404:
          description: Case ID not found
        400:
          description: Case cannot be updated because of invalid params.
        403:
          description: The configuration disabled updating case.
          
  "/{tenantId}/scheduled-cases/{caseId}/status":
    parameters:
      - $ref: "#/components/parameters/tenantId"
      - $ref: "#/components/parameters/caseId"
    get:
      operationId: getScheduledCaseStatus
      tags:
        - scheduled-cases
      summary: Get status of a case
      security:
        - jwt: []
      
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStatusResponse"
        404:
          description: Case not found or tenant not found
  
  "/{tenantId}/id-cases/{caseId}":
    get:
      tags:
        - scheduled-cases
      summary: Get detail information of a case
      operationId: getUbiIdCase
      security:
        - jwt: []

      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/caseId"
      
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UbiIdScheduledCase"
        404:
          description: Case has been deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/{tenantId}/id-cases/{caseId}/info":
    parameters:
      - $ref: "#/components/parameters/tenantId"
      - $ref: "#/components/parameters/caseId"
    get:
      operationId: getCaseInfo
      tags:
        - scheduled-cases
      summary: Get Fraud Check initialization info
      description: |
        Retrieves fraud check initialization information for a case. 
        Creates a new session ID if none exists, or returns the existing session ID for the case.
      security:
        - jwt: []
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudCheckInitResponse'
        400:
          description: User is not allowed to generate threatMetrix session id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Case not found or tenant not found

  "/{tenantId}/id-cases/{caseId}/files.zip":
    parameters:
      - $ref: "#/components/parameters/tenantId"
      - $ref: "#/components/parameters/caseId"
      - $ref: "#/components/parameters/archiveFolders"
      - $ref: '#/components/parameters/acceptOverride'
    get:
      tags:
        - scheduled-cases
      summary: Download all files available in a Case as a Zip file, except `*_original.pdf` and `*_signed.pdf` files if exist.
      description: |
        **IMPORTANT**:
        The response will be in `application/octet-stream` format if the `Accept` header value is `*/*`, `application/json`, or `application/octet-stream`.
        To return a zip file encoded in JSON format, set `application/zip+json` for the `Accept` header or use the `Accept-Override` header instead.
      operationId: getCaseFilesAsZip
      security:
        - jwt: []
      responses:
        200:
          description: ok
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/Base64EncodedFile'
          headers:
            Content-Disposition:
              description: |
                **Note**: This header will be not available when the media type is application/json 
                
                Instruct the User-Agent how to deal with the binary content.
                This operation **always** use `Content-Disposition: attachment`.
              schema:
                type: string
              examples:
                download:
                  value:
                    - attachment; filename="video.mp4"

  "/{tenantId}/id-cases/{caseId}/documents":
    parameters:
      - $ref: "#/components/parameters/tenantId"
      - $ref: "#/components/parameters/caseId"
      - in: query
        name: type
        required: true
        schema:
          $ref: "#/components/schemas/IdCaseDocumentType"
    get:
      tags:
        - scheduled-cases
      summary: Download document belongs to identification case
      operationId: getIdCaseDocument
      security:
        - jwt: []
      responses:
        200:
          description: PDF document file
          content:
            'application/pdf':
              schema:
                type: string
                format: binary
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/{tenantId}/id-cases/{caseId}/revoke":
    parameters:
      - $ref: "#/components/parameters/tenantId"
      - $ref: "#/components/parameters/caseId"
    put:
      tags:
        - scheduled-cases
      summary: Revoke m_ID Case
      description: |
        Revoke m_ID Case
      operationId: revokeCase
      security:
        - jwt: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UbiIdRevokeCaseRequest"
        required: false
      responses:
        200:
          description: Successfully revoke the case entity
        404:
          description: Case not found or tenant not found
        400:
          description: Case cannot be revoked because of param expirationTimestamp already passed.
        403:
          description: |
            Case status isn't allowed to be revoked. For e.g:
            * `IDENTIFICATION_SUCCESSFUL`
            * `VERIFICATION_CONFIRMED`
            * `DOWNLOADED`
            * `DELETED`
            * `DELETED_TEMPORARY`
            * `DELETED_MARKED`

  "/{tenantId}/id-cases/{caseId}/verification-result":
    parameters:
      - $ref: "#/components/parameters/tenantId"
      - $ref: "#/components/parameters/caseId"
    post:
      tags:
        - scheduled-cases
      summary: Tenant review
      security:
        - jwt: [ ]
      description: |
        This API is specially designed so that tenant can review the verification result.
      operationId: verificationResult

      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: "#/components/schemas/VerificationResultRequest"

      responses:
        200:
          description: ok
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/VerificationResultResponse"
        404:
          description: Case ID not found
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/public/tenants/{tenantId}/ais-registration-pdf/public-cert":
    get:
      tags:
      - public
      parameters:
        - $ref: "#/components/parameters/tenantId"
      summary: Get public key and certificate information
      description: |
        The API will provide information of PKCS#1 RSA Public Key (RFC3447) encoding in PEM format, expiration timestamps, and an X.509 Version 3 Certificate (RFC 5280) of the key.
        A new public key will be generated and returned before the current one expires in two weeks.
      operationId: getPublicKey
      responses:
        '200':
          description: Ais signing response with public key and certificate information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AisSigningResponse"
        '404':
          description: No activated keys found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/{tenantId}/actuator/health":
    get:
      parameters:
        - $ref: "#/components/parameters/tenantId"
      tags:
        - actuator
      operationId: forwardActuator
      summary: Get tenant-specific health status
      description: |
        Returns a simple health status for the tenant-specific context.
        This endpoint provides a basic health check response without performing detailed connectivity checks.

        **Health Check**: This API returns a basic health status indicator:
        - Returns a simple "UP" status response
        - Does not perform detailed connectivity checks to dependencies (databases, diskSpace, ssl, etc.)
        - Intended for basic availability monitoring

        **Rate Limiting**: This endpoint is subject to rate limiting to prevent abuse and ensure system stability.
        - Rate limit: 120 requests per minute per tenant
        - Exceeding the rate limit will result in HTTP 429 (Too Many Requests) response
        - Rate limit headers are included in responses to indicate current usage and limits
      responses:
        200:
          description: Actuator data forwarded successfully
          content:
            'application/json':
              schema:
                type: object
                description: Actuator response data (varies by actuator endpoint)
                example:
                  status: "UP"
        404:
          description: Actuator endpoint not found
        429:
          description: Too Many Requests - Rate limit exceeded

components:
  parameters:
    tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    caseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    archiveFolders:
      name: archiveFolders
      in: query
      required: false
      schema:
        type: boolean
      description: The option to return all archive folder in the zip file

    acceptOverride:
      name: Accept-Override
      in: header
      required: false
      description: |
        Override the `Accept` header and specify Media Type of the response format data. This field value should comply with RFC 6838.
        Supported override values:
        * `application/zip+json` - Zip file will be encoded and returned in `application/json` format
        * `application/pdf+json` - PDF file will be encoded and returned in `application/json` format
      schema:
        type: string
        example: 'application/zip+json'

  securitySchemes:
    jwt:
      type: http
      description: Default Authentication/Authorization
      scheme: bearer
      bearerFormat: JWT

  schemas:

    FraudCheckInitResponse:
      type: object
      description: Fraud Check initialization info
      properties:
        sessionId:
          type: string
          description: The ThreatMetrix session id
          example: "d2e5b8a8-7d4b-4e2e-9f22-8f1a2c4b9c1a"
        domain:
          type: string
          description: ThreatMetrix domain is used to map the profiling script base-url in the check function
          example: "example.com"
        organizationId:
          type: string
          description: ThreatMetrix organization id is used to map the profiling script organization id in the check function
          example: "your-org-id"

    UbiIdScheduledCase:
      type: object
      properties:
        tenantId:
          description: The id of the Tenant to receive the notification.
          type: string
          format: uuid
        ubiIdcaseId:
          description: The id of the identification case that was updated.
          type: string
          format: uuid
        extPersonId:
          nullable: true
          description: Person Id of external application.
          type: string
        identityProfile:
          description: The numeric id of a pre-configured profile.
          type: integer
        language:
          $ref: '#/components/schemas/Language'
        extCaseId:
          description: External Case Id can be set by the external application.
          type: string
          nullable: true
        extApplication:
          description: name of application ubiId service was called.
          type: string
          nullable: true
        ubiIdCategory:
          description: category of identification case. can be used for filtering in ubiId Backoffice application.
          type: string
          nullable: true
        expirationTimestamp:
          description: The datetime when this identification case is no longer resumable.
          type: string
          format: date-time
          example: "2020-11-21T15:23:23"
        ubiIdStatus:
          $ref: '#/components/schemas/UbiIdStatus'
        registrationStatus:
          $ref: '#/components/schemas/RegistrationStatus'
        initialPersonData:
          allOf:
            - $ref: '#/components/schemas/UbiIdPerson'
          nullable: true
        autoIdData:
          $ref: '#/components/schemas/IdentificationData'
        verificationData:
          $ref: '#/components/schemas/VerificationData'
        integrityChecksResult:
          $ref: '#/components/schemas/IntegrityChecksResult'
        termsConditionsAcceptanceTimestamp:
          type: string
          format: date-time
        ubiIdStatusReason:
          allOf:
            - $ref: '#/components/schemas/UbiIdStatusReason'
          nullable: true
          description: The reason that the case status is updated.
        ubiIdStatusDetails:
          description: The details for that reason.
          type: string
          nullable: true
        reviewComment:
          type: string
          description: review comment of verification from identification provider
          nullable: true
        identificationRedirectUrls:
          $ref: '#/components/schemas/IdentificationRedirectUrls'
        signatureImageStatus:
          type: string
          nullable: true
          description: the signature status for the document
        evidenceImportStatus:
          allOf:
            - $ref: '#/components/schemas/EvidenceImportStatus'
          nullable: true
        isRevoked:
          description: whether this case is revoked or not.
          type: boolean
        termsAndConditionsAlreadyAccepted:
          description: |
            Option to skip legal step on identification flow.
            Can only be `true` when attribute `allowExternalAcceptanceOfTermsAndConditions` in profile is enabled, otherwise `false`.
          type: boolean
        dataChecks:
          description: list of data check results
          type: array
          items:
            $ref: '#/components/schemas/DataCheckDetail'
        costCenter:
          description: Cost center can be defined by customer.
          type: string
          nullable: true
        fraudRisk:
          description: Fraud risk.
          $ref: '#/components/schemas/FraudRisk'
        identificationLoadingDisplayed:
          description: Loading page is displayed.
          type: boolean
        identificationSuccessInsideIframe:
          description: Receive the success message from inside iframe.
          type: boolean

    FraudRisk:
      type: object
      description: Fraud risk.
      nullable: true
      properties:
        risk_rating:
          description: Risk rating.
          nullable: true
        riskCode:
          description: Risk code.
          type: array
          items:
            type: string
          nullable: true
        fraudCheckId:
          type: string
          format: uuid
          description: Unique identifier for the fraud check.
          nullable: true
        request_id:
          type: string
          format: uuid
          description: Unique identifier for the request.
          nullable: true
        risk_score:
          type: string
          description: Risk score associated with the fraud assessment.
          nullable: true
        risk_rules:
          type: array
          description: List of rules contributing to the fraud risk assessment.
          items:
            $ref: '#/components/schemas/RiskRule'
        device:
          $ref: '#/components/schemas/Device'
        network:
          $ref: '#/components/schemas/Network'
        digitalId:
          $ref: '#/components/schemas/DigitalId'
        account:
          $ref: '#/components/schemas/Account'
        sessionHistory:
          $ref: '#/components/schemas/SessionHistory'
        identDeviceHistory:
          type: array
          description: History of ThreatMetrix sessions for the case, ordered chronologically (oldest first).
          items:
            $ref: '#/components/schemas/IdentDeviceHistory'
          nullable: true

    SessionHistory:
      type: object
      description: Aggregate counts of distinct values across the case's ThreatMetrix sessions.
      nullable: true
      properties:
        numberOfDeviceIds:
          type: integer
          description: Number of distinct device IDs across all sessions.
        numberOfTrueIpGeo:
          type: integer
          description: Number of distinct true IP geo locations across all sessions.
        numberOfTrueIpRegionIsoCodes:
          type: integer
          description: Number of distinct true IP region ISO codes across all sessions.

    IdentDeviceHistory:
      type: object
      description: Fraud-relevant data for a single ThreatMetrix session.
      properties:
        timestamp:
          type: string
          format: date-time
          description: Time the session was last updated.
          nullable: true
        step:
          type: string
          description: Identification step the session belongs to.
          nullable: true
        deviceId:
          type: string
          description: Unique identifier for the device.
          nullable: true
        risk_rating:
          type: string
          description: Risk rating of the session.
          nullable: true
        risk_score:
          type: string
          description: Risk score associated with the session.
          nullable: true
        risk_rule_categories:
          type: array
          description: Categories of triggered risk rules.
          items:
            type: string
          nullable: true
        true_ip_address:
          type: string
          description: True IP address of the request.
          nullable: true
        true_ip_geo:
          type: string
          description: Geographical location code of the IP address (e.g., CH for Switzerland).
          nullable: true
        true_ip_region_iso_code:
          type: string
          description: ISO code for the region of the IP address.
          nullable: true
        true_ip_city:
          type: string
          description: City associated with the IP address.
          nullable: true
        browser_spoof_rating:
          type: string
          description: Rating indicating likelihood of browser spoofing (e.g., low, high).
          nullable: true
        vpn_rating:
          type: string
          description: Rating indicating likelihood of VPN usage (e.g., low, high).
          nullable: true

    RiskRule:
      type: object
      description: Represents a single rule contributing to the fraud risk assessment.
      properties:
        rid:
          type: string
          description: Unique identifier for the risk rule.
          nullable: true
        score:
          type: string
          description: Score associated with the risk rule.
          nullable: true
        reason_code:
          type: string
          description: Reason code for the risk rule (e.g., Device_blocked, email_known).
          nullable: true

    Account:
      type: object
      description: Represents account details.
      nullable: true
      properties:
        account_first_name:
          type: string
          description: First name of the account holder.
          nullable: true
        account_last_name:
          type: string
          description: Last name of the account holder.
          nullable: true
        account_address_zip:
          type: string
          description: ZIP code of the account holder's address.
          nullable: true
        account_address_city:
          type: string
          description: City of the account holder's address.
          nullable: true
        account_address_street_1:
          type: string
          description: Primary street address of the account holder.
          nullable: true
        account_address_street_2:
          type: string
          description: Secondary street address of the account holder.
          nullable: true
        account_telephone:
          type: string
          description: Telephone number of the account holder.
          nullable: true
        account_telephone_first_seen:
          type: string
          description: Date when the telephone number was first seen.
          nullable: true
        account_telephone_activities:
          type: array
          description: List of activities associated with the telephone number.
          items:
            type: string
          nullable: true
        account_email:
          type: string
          description: Email address of the account holder.
          nullable: true
        account_email_first_seen:
          type: string
          description: Date when the email address was first seen.
          nullable: true
        account_email_activities:
          type: array
          description: List of activities associated with the email address.
          items:
            type: string
          nullable: true

    DigitalId:
      type: object
      description: Represents digital identity information.
      nullable: true
      properties:
        digital_id:
          type: string
          description: Unique digital identifier for the user or device.
          nullable: true
        digital_id_first_seen:
          type: string
          description: Date when the digital ID was first seen.
          nullable: true
        digital_id_confidence_rating:
          type: string
          description: Confidence rating for the digital ID (e.g., low, medium, high).
          nullable: true
        digital_id_trust_score_rating:
          type: string
          description: Trust score rating for the digital ID (e.g., neutral, high).
          nullable: true

    Device:
      type: object
      description: Represents device information used in the fraud assessment.
      nullable: true
      properties:
        device_id:
          type: string
          description: Unique identifier for the device.
          nullable: true
        device_first_seen:
          type: string
          description: Date when the device was first seen.
          nullable: true
        device_activities:
          type: array
          description: List of activities associated with the device.
          items:
            type: string
          nullable: true
        os:
          type: string
          description: Operating system of the device.
          nullable: true
        os_version:
          type: string
          description: Version of the operating system.
          nullable: true
        browser:
          type: string
          description: Browser used on the device.
          nullable: true
        browser_version:
          type: string
          description: Version of the browser.
          nullable: true
        agent_type:
          type: string
          description: Type of agent (e.g., browser_computer).
          nullable: true
        screen_res:
          type: string
          description: Screen resolution of the device.
          nullable: true
        timezone_name:
          type: string
          description: Timezone name of the device.
          nullable: true

    Network:
      type: object
      description: Represents network information used in the fraud assessment.
      nullable: true
      properties:
        true_ip:
          type: string
          description: True IP address of the request.
          nullable: true
        true_ip_geo:
          type: string
          description: Geographical location code of the IP address (e.g., CH for Switzerland).
          nullable: true
        true_ip_region_iso_code:
          type: string
          description: ISO code for the region of the IP address.
          nullable: true
        true_ip_city:
          type: string
          description: City associated with the IP address.
          nullable: true
        true_ip_postal_code:
          type: string
          description: Postal code associated with the IP address.
          nullable: true
        true_ip_isp:
          type: string
          description: Internet Service Provider of the IP address.
          nullable: true
        true_ip_organization_type:
          type: string
          description: Type of organization associated with the IP address (e.g., Telecommunications).
          nullable: true
        browser_spoof_rating:
          type: string
          description: Rating indicating likelihood of browser spoofing (e.g., low, high).
          nullable: true
        vpn_rating:
          type: string
          description: Rating indicating likelihood of VPN usage (e.g., low, high).
          nullable: true

    CaseStatusResponse:
      type: object
      properties:
        caseStatus:
          $ref: '#/components/schemas/UbiIdStatus'
